<!-- Privacy / hardening meta (GitHub Pages ne permet pas les headers HTTP custom). -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#4263a0">
{% if site.google_analytics %}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
{% include head-custom-google-analytics.html %}
{% else %}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
{% endif %}
